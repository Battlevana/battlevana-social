<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Blanka;src:url(assets/blanka.otf)}
@font-face{font-family:OpenSans;src:url(assets/opensans.ttf);font-weight:300 800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#F3F1E8}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:OpenSans,sans-serif;color:#001B2E;background:#F3F1E8}
.bg{position:absolute;inset:-60px;background-position:center;background-size:cover;filter:blur(34px) saturate(1.1);opacity:.22;transform:scale(1.1)}
.shade{position:absolute;inset:0;background:
 radial-gradient(ellipse 70% 45% at 50% 47%, rgba(201,161,39,.30), rgba(201,161,39,0) 70%),
 linear-gradient(180deg, rgba(243,241,232,.92) 0%, rgba(243,241,232,.35) 22%, rgba(243,241,232,.35) 68%, rgba(243,241,232,.97) 86%)}
.top{position:absolute;top:56px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between}
.tag{background:#C9A127;color:#001B2E;font-family:Blanka;font-size:30px;letter-spacing:3px;padding:14px 26px 10px;border-radius:6px}
.set{text-align:right;font-weight:700;font-size:22px;letter-spacing:2.5px;text-transform:uppercase;line-height:1.3;opacity:.92}
.set small{display:block;font-weight:400;font-size:18px;letter-spacing:1.5px;opacity:.75;text-transform:none}
.card{display:block;border-radius:4.6%/3.4%;box-shadow:0 30px 70px rgba(0,27,46,.28),0 0 0 3px rgba(0,27,46,.08)}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0}
.logo img{width:150px}
.logo span{font-size:16px;font-weight:600;letter-spacing:2px;opacity:.8}
.bottom{position:absolute;left:64px;right:64px;bottom:56px;display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.name{font-family:Blanka;font-size:50px;line-height:1.05;letter-spacing:1.5px}
.name em{display:block;font-style:normal;font-size:28px;letter-spacing:3px;color:#86680F;margin-top:4px}
.meta{margin-top:12px;font-size:22px;font-weight:600;display:flex;align-items:center;gap:14px}
.rar{display:inline-block;padding:5px 14px;border-radius:20px;font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:2px solid #86680F;color:#86680F}
.hook{margin-top:14px;font-size:23px;line-height:1.35;opacity:.9;max-width:700px}
.count{display:none}
</style></head><body><div class="post"><div class="bg" style="background-image:url(/tmp/bv-cards/the-darkhold_art.jpg)"></div><div class="shade"></div><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px"><img src="assets/logo_blue_crop.png" style="width:300px"><div class="name" style="font-size:54px;margin-top:44px;line-height:1.15">YOUR HOME FOR<br><span style="color:#86680F">MAGIC THE GATHERING</span></div><div class="hook" style="margin:22px auto 0;font-size:26px;max-width:760px">Every new spoiler and everything Magic on battlevana.be</div><div style="width:120px;height:3px;background:#C9A127;margin:70px 0 60px"></div><div style="font-size:30px;font-weight:700">Looking for cards?</div><div style="font-size:24px;opacity:.85;margin-top:8px">Check out our partner</div><img src="assets/emjati-logo.svg" style="width:560px;margin-top:34px;filter:brightness(0)"><div style="font-size:22px;font-weight:700;letter-spacing:3px;margin-top:22px;color:#86680F">EMJATI.COM</div></div></div></body></html>
